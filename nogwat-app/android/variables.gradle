ext {
    minSdkVersion = 23
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    // Capacitor 8's generated Cordova bridge defaults to 14.0.1. Keeping the
    // old 10.x override pulls split Kotlin 1.6 artifacts alongside the modern
    // Kotlin standard library and fails Android's duplicate-class check.
    cordovaAndroidVersion = '14.0.1'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
}
